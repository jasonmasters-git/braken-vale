<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bracken Vale | Equipment Edition</title>
<style>
:root{color-scheme:dark;--bg:#171b16;--panel:#232921;--line:#42493a;--gold:#edca80;--muted:#b9c0ad;--ink:#f7f0dd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px system-ui}button,input,textarea,select{font:inherit}button,input,textarea,select{border:1px solid var(--line);border-radius:8px;background:#1c221a;color:inherit;padding:10px;min-height:44px}button{cursor:pointer}button:hover,button:focus-visible{border-color:var(--gold)}button[aria-current=true],.primary{background:var(--gold);color:#211d14;border-color:var(--gold)}h1,h2,h3{font-family:Georgia,serif;margin:0}h1{font-size:clamp(2.6rem,8vw,5rem);line-height:1}h2{font-size:2rem}p{color:var(--muted)}header{background:radial-gradient(ellipse at 78% 0%,#46523b,transparent 70%),#252e23;border-bottom:1px solid var(--line)}.wrap{max-width:1050px;margin:auto;padding:20px}header .wrap{padding-block:35px}.eyebrow{letter-spacing:.18em;text-transform:uppercase;font-size:.75rem;color:var(--gold);font-weight:bold}nav,.row,.tabs{display:flex;gap:8px;flex-wrap:wrap}.row{align-items:center;justify-content:space-between}.tabs button{font-size:.9rem}.card{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:16px;margin:12px 0}.layout{display:grid;grid-template-columns:1.25fr 1fr;gap:14px}.layout .card{margin-top:0}.doll{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(56px,.9fr) minmax(0,1fr);gap:9px;align-items:center;min-height:280px;background:radial-gradient(ellipse,#434837,transparent 70%);margin-top:12px}.slot{width:100%;text-align:left;padding:8px;min-height:67px;overflow-wrap:anywhere}.slot b{display:block;font-size:.72rem;color:var(--gold);text-transform:uppercase;letter-spacing:.04em}.slot span{font-size:.85rem}.slots{display:grid;gap:8px}.doll svg{width:100%;max-height:245px;filter:drop-shadow(0 4px 8px #111)}label{display:grid;gap:5px;color:var(--muted);font-size:.86rem}input,textarea,select{width:100%;color:var(--ink);min-width:0}textarea{min-height:90px;resize:vertical}.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stack{display:grid;gap:12px}.subtle{font-size:.85rem;color:var(--muted)}dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(440px,calc(100% - 28px));padding:20px}dialog::backdrop{background:#000a}footer{padding-bottom:24px}#status{color:var(--gold)}@media(max-width:690px){.layout{grid-template-columns:1fr;gap:3px}.wrap{padding:14px}header .wrap{padding-block:25px}.tabs{flex-wrap:nowrap;overflow:auto;padding-bottom:5px}.tabs button{flex:none}.card{padding:12px}}
.cloud-panel{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}.cloud-panel summary{cursor:pointer;color:var(--gold);width:fit-content;padding:12px 0}.cloud-panel .fields{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.slot-wrap{position:relative;min-width:0}
.item-tip{display:none;position:absolute;z-index:2;left:0;top:100%;width:min(235px,78vw);padding:10px;background:#171b16;border:1px solid var(--gold);border-radius:8px;box-shadow:0 6px 20px #0008;pointer-events:none}
.slots:last-child .item-tip{left:auto;right:0}
.slot:focus-visible + .item-tip{display:block}
@media (hover:hover){.slot:hover + .item-tip{display:block}}
.item-tip span,#equipped-details span,#item-results span{display:block;color:var(--muted);font-size:.87rem;margin-top:4px}
#equip{width:min(575px,calc(100% - 24px));max-height:85dvh}
#item-results{list-style:none;margin:0;padding:0;display:grid;gap:6px;max-height:34dvh;overflow:auto}
#item-results button{width:100%;text-align:left}
#equipped-details{border-left:2px solid var(--gold);padding-left:10px}
</style>
<header><div class="wrap"><div class="eyebrow">Five Leagues from the Borderlands</div><h1>Bracken Vale</h1><div class="eyebrow">Equipment Edition</div><p id="subtitle"></p><nav aria-label="Tracker views"><button data-view="warband">Warband</button><button data-view="campaign">Campaign</button><button data-view="journal">Journal</button></nav></div></header>

<main class="wrap" id="app"></main><footer class="wrap"><div class="row"><small id="status" role="status">Saved in this browser</small><div><button id="export">Export backup</button> <button id="import">Import backup</button><input hidden type="file" id="file" accept=".json,application/json"></div></div><section class="cloud-panel" aria-label="Cloud save">
<details id="cloud-signin" hidden><summary>Sign in to sync</summary>
<form id="cloud-login" class="card stack">
<div class="fields"><label>Email<input type="email" name="email" autocomplete="username" required></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label></div>
<div><button class="primary">Sign in</button></div>
</form></details>
<div class="row"><small id="cloud-status" role="status"></small><div>
<button id="cloud-upload" hidden>Upload this campaign</button>
<button id="cloud-retry" hidden>Retry sync</button>
<button id="cloud-load" hidden>Use cloud copy</button>
<details id="cloud-account" hidden><summary>Account</summary><button id="cloud-out" type="button">Sign out</button></details>
</div></div>
</section></footer>
<dialog id="equip" aria-labelledby="slotTitle">
<form id="equipForm" class="stack">
<h2 id="slotTitle" tabindex="-1" autofocus></h2>
<div id="equipped-details" hidden></div>
<label>Search equipment<input id="item-search" type="search" placeholder="Item, stat, or property"></label>
<ul id="item-results" aria-label="Available equipment"></ul>
<details><summary>Custom item</summary>
<label>Item name<input name="item" maxlength="120"></label>
<button class="primary">Save custom item</button>
</details>
<div class="row"><button type="button" id="cancelEquip">Close</button><button type="button" id="unequip">Unequip</button></div>
</form>
</dialog>
<script src="./item-catalog.js"></script>
<script src="./tracker.js"></script>
<script src="./supabase-config.js"></script>
<script type="module" src="./cloud-sync.js"></script></html>
